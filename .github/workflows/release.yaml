name: Release Charts

on:
  push:
    paths:
      - '**/Chart.yaml'
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    # depending on default permission settings for your org (contents being read-only or read-write for workloads), you will have to add permissions
    # see: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # Clears the Node 20 deprecation warning from your last run
        with:
          # cr needs full history to work out which charts changed
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4 # Same; verified token is still a valid input in v4, so it's a drop-in
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Release
        uses: helm/chart-releaser-action@v1.7.0 # Adds the pages_branch input you asked about, plus skip_existing and mark_as_latest as real inputs
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          config: .github/ci/cr.yaml
          # Branch cr writes index.yaml to. Defaults to gh-pages, so this line is only
          # needed for a different one - and GitHub Pages must point at the SAME branch,
          # or `helm repo add` 404s while the landing page still renders fine:
          #   gh api -X PUT repos/<owner>/<repo>/pages \
          #     -f 'source[branch]=<branch>' -f 'source[path]=/'
          # Needs v1.7.0+; v1.5.0 hardcoded gh-pages and ignored this input.
          # pages_branch: gh-pages